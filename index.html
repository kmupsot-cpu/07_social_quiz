<header><div class="eyebrow">心理疾病職能治療學 · 115 學年度第 1 學期</div><h1>溝通與社交互動技能｜課後測驗</h1><p class="intro">15 題四選一單選題，每題僅有一個最適當答案。建議作答時間 25–30 分鐘。</p><p class="intro">每題 1 分，滿分 15 分。請依講義所述概念與情境判斷。</p><div class="meta"><label>姓名 <input aria-label="姓名"></label><label>學號 <input aria-label="學號"></label></div></header>
<div class="tools"><button class="primary" id="grade">提交並計分</button><button id="answers" aria-pressed="false">顯示答案與解析</button><button id="print">列印／另存 PDF</button><button id="reset">清除作答</button></div>
<p class="intro" style="font-size:14px">可離線使用。列印會依目前狀態顯示或隱藏解析；若要列印學生題本，請先隱藏答案與解析。作答不會傳送至網路，重新載入頁面後會清除。</p><div id="result" role="status" aria-live="polite"></div><form id="quiz"></form>
<noscript><p>JavaScript 未啟用：以下提供靜態題本與答案，啟用後可使用計分功能。</p><ol><li><p>個案能理解詞彙，但在小組討論時常打斷他人；治療師同時發現座位安排使他難以看見其他成員。下列分析何者最符合講義的架構？</p><ol type="A"><li>詞彙理解、輪替發言與座位安排皆屬個案因素</li><li>詞彙理解涉及個案因素，輪替發言涉及表現技能，座位安排涉及環境與情境</li><li>輪替發言屬環境因素，座位安排屬表現技能</li><li>只要語言能力正常，就不需再評估社交互動</li></ol></li><li><p>個案因交通不便而多次缺席復健，表示：「環境根本不允許我改善。」依講義，治療師最適當的回應為何？</p><ol type="A"><li>提醒他結果完全取決於努力，應停止找理由</li><li>將他歸類為固定的外控人格，降低治療目標</li><li>先代替他決定所有後續行程，以免再次失敗</li><li>先理解交通限制，再共同找出一項可控制且可完成的下一步</li></ol></li><li><p>個案說：「我不想麻煩別人。」治療師考慮這句話可能涉及害怕、羞愧或希望被尊重。下列回應最能確認個案意圖的是哪一項？</p><ol type="A"><li>詢問：「你最擔心的是什麼？」並依回應進一步澄清</li><li>將此句直接記錄為拒絕所有協助，不再追問</li><li>告訴個案：「你其實就是害怕被拒絕。」</li><li>僅解釋「麻煩」的字面定義，確認詞彙理解即可</li></ol></li><li><p>學生已專心看完「加入對話」示範，也能說出步驟，但實際練習時仍無法做出等待空檔、接續話題的行為。依觀察學習歷程，目前最直接需要加強哪一項？</p><ol type="A"><li>注意歷程：增加觀看示範時的專注</li><li>保留歷程：只再背誦步驟名稱</li><li>產出歷程：透過分段行為演練將記憶轉為表現</li><li>動機歷程：只在完成整段對話後給獎勵</li></ol></li><li><p>依附理論在溝通與人際互動中的核心意義，下列何者最適當？</p><ol type="A"><li>依附經驗只影響嬰兒的身體發展，與人際期待無關</li><li>早期照顧經驗可影響安全感、信任及對關係的期待</li><li>只要觀察一次退縮行為，就能確定其依附類型</li><li>不同依附類型只反映語言能力高低</li></ol></li><li><p>某機構以內部規定禁止所有有精神疾病診斷者參與對外服務，即使個別成員已具備所需能力。此例最直接對應哪一層次的污名？</p><ol type="A"><li>結構污名：制度與規範限制參與機會</li><li>自我污名：個案將負面看法套用於自身</li><li>僅是個別成員的情緒辨識困難</li><li>僅是個案尚未學會觀察模仿</li></ol></li><li><p>首次評估時，個案說：「做這些評估根本沒有用。」治療師最適當的初步回應為何？</p><ol type="A"><li>強調這是固定流程，請他先完成再討論</li><li>立即指出他缺乏病識感，請家屬代為作答</li><li>承諾只要完成評估，問題一定會改善</li><li>先了解他認為無用的原因，再說明目的並共同討論評估方式</li></ol></li><li><p>個案具備活動所需能力，卻因機構只接受單一報名方式而無法參加。治療師與機構討論增加可近用的報名管道。這最符合 IRM 的哪一種模式？</p><ol type="A"><li>鼓勵（Encouraging）：增加嘗試意願</li><li>教導（Instructing）：提供資訊與示範</li><li>倡議（Advocating）：處理環境與制度障礙</li><li>同理（Empathizing）：理解並承接情緒經驗</li></ol></li><li><p>治療師評估兩位文化背景不同的個案在角色扮演中的眼神、距離與語氣。下列評估原則何者最合適？</p><ol type="A"><li>以持續直視對方作為所有情境的最高評分標準</li><li>先界定情境要求與文化脈絡，再用明確行為指標記錄表現及提示程度</li><li>只依整體印象判斷「社交好不好」，避免細分行為</li><li>只看說話次數，不需記錄對方回應及調整能力</li></ol></li><li><p>某團體的成員能依需要互換角色，兼顧任務成果與彼此感受，帶領者也以平等夥伴身分參與。依講義，此表現最符合哪個階段？</p><ol type="A"><li>平行階段（Parallel）</li><li>專案階段（Project）</li><li>自我中心合作階段（Egocentric Cooperative）</li><li>成熟階段（Mature）</li></ol></li><li><p>治療師要教導「加入正在進行的對話」。下列安排最符合講義的 SST 五步驟循環？</p><ol type="A"><li>界定技能與成功標準、示範、角色扮演、具體回饋、跨情境泛化</li><li>先反覆說明所有社交規則，等完全記住後才安排演練</li><li>直接進入高難度真實情境，只在失敗後說明正確做法</li><li>只練熟同一套台詞，並以背誦正確率作為最終成果</li></ol></li><li><p>治療師為即將參加社團的學生撰寫社會故事，下列設計何者最適當？</p><ol type="A"><li>強調「一定要立刻回答所有問題」，以建立服從規則</li><li>以一份通用故事取代對個別情境的了解</li><li>描述真實情境與他人可能觀點，提供可行選擇，並搭配理解確認及演練</li><li>只記錄學生曾經做錯的行為，要求反覆閱讀避免再犯</li></ol></li><li><p>兩人合作規劃校園行程時，受訓同儕為了提高完成效率，直接替個案回答並決定所有地點。依講義，最適當的調整為何？</p><ol type="A"><li>讓同儕繼續代答，只要完成行程表即達成目標</li><li>要求成人全程指揮，避免兩人意見不同</li><li>只計算個案說話次數，不需考慮決定權</li><li>讓雙方各持不同資訊，同儕邀請意見後等待，成人僅在必要時提示</li></ol></li><li><p>孩子看到有趣的玩具後，將玩具舉向成人並發出聲音分享，但沒有持續眼神接觸。依講義，最適當的判斷為何？</p><ol type="A"><li>只要沒有持續眼神接觸，就不能算任何共享注意表現</li><li>展示與聲音可能是主動分享興趣的線索，應觀察是否與成人共享對該玩具的注意</li><li>應先停止遊戲，直到孩子能長時間直視成人</li><li>只有用完整句子描述玩具，才可以記錄為成功</li></ol></li><li><p>學生已能在治療室向固定治療師提出請求。若目標是提升日常校園參與，下一步最能確認介入成效的做法為何？</p><ol type="A"><li>更換人物與場所安排真實請求任務，記錄獨立表現、提示需求及互動品質</li><li>增加同一治療師、同一台詞的背誦次數，作為唯一成效指標</li><li>直接認定能力已能運用於所有校園情境，結束追蹤</li><li>改以理論名詞測驗取代實際互動觀察</li></ol></li></ol><details><summary>參考答案與解析</summary><p><strong>1. B</strong>：講義區分個案因素（心智功能與語言能力）、表現技能（社交互動技能與語用）及環境與情境。評估需兼顧不同層次，不能只由語言能力推定互動表現。（第 5 張）</p><p><strong>2. D</strong>：講義強調先同理不可控限制，再找出可控制、可完成的行動。內外控是連續光譜，會隨任務、資源與情境變化，不宜當成固定標籤。（第 8 張）</p><p><strong>3. A</strong>：言語意圖需要結合語句、情境及共同知識理解，但推論仍須向個案確認。開放式追問能釐清真正顧慮，避免只回應字面或過早替個案下結論。（第 9 張）</p><p><strong>4. C</strong>：注意、保留、產出與動機是講義所列的觀察學習歷程。題幹已呈現注意與記憶保留，主要困難在把已知步驟轉為實際行為，因此應加強產出歷程。（第 13、15 張）</p><p><strong>5. B</strong>：講義以嬰兒與主要照顧者的情感連結為基礎，說明依附經驗與安全、保護及後續關係期待的連結。單一互動行為不足以直接判定依附類型。（第 10–12 張）</p><p><strong>6. A</strong>：結構污名涉及制度、政策與組織慣例造成不利結果。題目指出限制來自機構規定，不能只用個人的技能或自我信念解釋。（第 16 張）</p><p><strong>7. D</strong>：評估同時是建立合作關係的過程。應理解個案的問題定義與經驗，說明目的並提供參與決策的機會。拒絕或質疑是需要理解的線索，不能直接等同不合作。（第 20–22、26 張）</p><p><strong>8. C</strong>：倡議模式著重處理環境與制度障礙。此例的關鍵不是個案技能不足，而是報名方式限制其參與，因此治療師與機構協商改善管道。（第 25 張）</p><p><strong>9. B</strong>：講義提醒同一行為在不同關係、場所、角色與文化脈絡中可能意義不同。角色扮演應觀察具體表現，並採可重複的評分方式，而非只看口語流暢或單一行為。（第 28–30 張）</p><p><strong>10. D</strong>：成熟階段的特徵包括任務與關係需求的平衡、彈性的角色結構及共享領導。應以實際團體表現辨識階段，而非只根據成員年齡。（第 33–34 張）</p><p><strong>11. A</strong>：SST 將技能拆成可教、可練與可回饋的行為。講義依序列出界定技能、示範、角色扮演、具體回饋及情境泛化，並提醒需記錄新情境中的實際表現。（第 37–39 張）</p><p><strong>12. C</strong>：社會故事應個別化、簡短、正向，描述多於命令，包含情境線索、觀點與可行選擇。它是情境預告與理解工具，仍需配合環境調整及實際互動練習。（第 40–41 張）</p><p><strong>13. D</strong>：同儕媒介介入要讓雙方都有資訊與決定權。同儕需學習邀請、等待與回應，不代替個案回答；成果同時看共同決策、投入及參與品質，不能只看任務完成。（第 42–43 張）</p><p><strong>14. B</strong>：聯合注意力重點在共享對物件或事件的注意。眼神、手勢、展示、聲音、語言或 AAC 都可能提供成功線索，仍須觀察其共享功能，不能只以持續眼神接觸或完整口語為唯一標準。（第 44–45 張）</p><p><strong>15. A</strong>：講義強調跨人物、場所與難度的情境泛化，並兼顧提示程度與參與品質。治療室的熟悉任務表現進步，仍需透過新情境中的行為與參與紀錄確認能否運用。（第 37–39、42–45 張）</p></details></noscript>
<footer>命題依據：《115-1 07 溝通和社交互動技能 (1-46)》講義（共 46 張投影片）。解析所附頁次指原始簡報投影片編號。情境為依講義概念改寫的命題案例，非量表原始題項。頁次依檔案中的投影片順序計算。</footer>
</main><script>
const questions=[{"topic": "OTPF-4 與構成要素", "ref": "第 5 張", "q": "個案能理解詞彙，但在小組討論時常打斷他人；治療師同時發現座位安排使他難以看見其他成員。下列分析何者最符合講義的架構？", "o": ["詞彙理解、輪替發言與座位安排皆屬個案因素", "詞彙理解涉及個案因素，輪替發言涉及表現技能，座位安排涉及環境與情境", "輪替發言屬環境因素，座位安排屬表現技能", "只要語言能力正常，就不需再評估社交互動"], "a": 1, "e": "講義區分個案因素（心智功能與語言能力）、表現技能（社交互動技能與語用）及環境與情境。評估需兼顧不同層次，不能只由語言能力推定互動表現。"}, {"topic": "內外控信念", "ref": "第 8 張", "q": "個案因交通不便而多次缺席復健，表示：「環境根本不允許我改善。」依講義，治療師最適當的回應為何？", "o": ["提醒他結果完全取決於努力，應停止找理由", "將他歸類為固定的外控人格，降低治療目標", "先代替他決定所有後續行程，以免再次失敗", "先理解交通限制，再共同找出一項可控制且可完成的下一步"], "a": 3, "e": "講義強調先同理不可控限制，再找出可控制、可完成的行動。內外控是連續光譜，會隨任務、資源與情境變化，不宜當成固定標籤。"}, {"topic": "語言意圖與語用", "ref": "第 9 張", "q": "個案說：「我不想麻煩別人。」治療師考慮這句話可能涉及害怕、羞愧或希望被尊重。下列回應最能確認個案意圖的是哪一項？", "o": ["詢問：「你最擔心的是什麼？」並依回應進一步澄清", "將此句直接記錄為拒絕所有協助，不再追問", "告訴個案：「你其實就是害怕被拒絕。」", "僅解釋「麻煩」的字面定義，確認詞彙理解即可"], "a": 0, "e": "言語意圖需要結合語句、情境及共同知識理解，但推論仍須向個案確認。開放式追問能釐清真正顧慮，避免只回應字面或過早替個案下結論。"}, {"topic": "觀察學習歷程", "ref": "第 13、15 張", "q": "學生已專心看完「加入對話」示範，也能說出步驟，但實際練習時仍無法做出等待空檔、接續話題的行為。依觀察學習歷程，目前最直接需要加強哪一項？", "o": ["注意歷程：增加觀看示範時的專注", "保留歷程：只再背誦步驟名稱", "產出歷程：透過分段行為演練將記憶轉為表現", "動機歷程：只在完成整段對話後給獎勵"], "a": 2, "e": "注意、保留、產出與動機是講義所列的觀察學習歷程。題幹已呈現注意與記憶保留，主要困難在把已知步驟轉為實際行為，因此應加強產出歷程。"}, {"topic": "依附理論", "ref": "第 10–12 張", "q": "依附理論在溝通與人際互動中的核心意義，下列何者最適當？", "o": ["依附經驗只影響嬰兒的身體發展，與人際期待無關", "早期照顧經驗可影響安全感、信任及對關係的期待", "只要觀察一次退縮行為，就能確定其依附類型", "不同依附類型只反映語言能力高低"], "a": 1, "e": "講義以嬰兒與主要照顧者的情感連結為基礎，說明依附經驗與安全、保護及後續關係期待的連結。單一互動行為不足以直接判定依附類型。"}, {"topic": "精神疾病污名", "ref": "第 16 張", "q": "某機構以內部規定禁止所有有精神疾病診斷者參與對外服務，即使個別成員已具備所需能力。此例最直接對應哪一層次的污名？", "o": ["結構污名：制度與規範限制參與機會", "自我污名：個案將負面看法套用於自身", "僅是個別成員的情緒辨識困難", "僅是個案尚未學會觀察模仿"], "a": 0, "e": "結構污名涉及制度、政策與組織慣例造成不利結果。題目指出限制來自機構規定，不能只用個人的技能或自我信念解釋。"}, {"topic": "評估與關係建立", "ref": "第 20–22、26 張", "q": "首次評估時，個案說：「做這些評估根本沒有用。」治療師最適當的初步回應為何？", "o": ["強調這是固定流程，請他先完成再討論", "立即指出他缺乏病識感，請家屬代為作答", "承諾只要完成評估，問題一定會改善", "先了解他認為無用的原因，再說明目的並共同討論評估方式"], "a": 3, "e": "評估同時是建立合作關係的過程。應理解個案的問題定義與經驗，說明目的並提供參與決策的機會。拒絕或質疑是需要理解的線索，不能直接等同不合作。"}, {"topic": "IRM 意向關係模式", "ref": "第 25 張", "q": "個案具備活動所需能力，卻因機構只接受單一報名方式而無法參加。治療師與機構討論增加可近用的報名管道。這最符合 IRM 的哪一種模式？", "o": ["鼓勵（Encouraging）：增加嘗試意願", "教導（Instructing）：提供資訊與示範", "倡議（Advocating）：處理環境與制度障礙", "同理（Empathizing）：理解並承接情緒經驗"], "a": 2, "e": "倡議模式著重處理環境與制度障礙。此例的關鍵不是個案技能不足，而是報名方式限制其參與，因此治療師與機構協商改善管道。"}, {"topic": "角色扮演評估", "ref": "第 28–30 張", "q": "治療師評估兩位文化背景不同的個案在角色扮演中的眼神、距離與語氣。下列評估原則何者最合適？", "o": ["以持續直視對方作為所有情境的最高評分標準", "先界定情境要求與文化脈絡，再用明確行為指標記錄表現及提示程度", "只依整體印象判斷「社交好不好」，避免細分行為", "只看說話次數，不需記錄對方回應及調整能力"], "a": 1, "e": "講義提醒同一行為在不同關係、場所、角色與文化脈絡中可能意義不同。角色扮演應觀察具體表現，並採可重複的評分方式，而非只看口語流暢或單一行為。"}, {"topic": "團體社會發展層級", "ref": "第 33–34 張", "q": "某團體的成員能依需要互換角色，兼顧任務成果與彼此感受，帶領者也以平等夥伴身分參與。依講義，此表現最符合哪個階段？", "o": ["平行階段（Parallel）", "專案階段（Project）", "自我中心合作階段（Egocentric Cooperative）", "成熟階段（Mature）"], "a": 3, "e": "成熟階段的特徵包括任務與關係需求的平衡、彈性的角色結構及共享領導。應以實際團體表現辨識階段，而非只根據成員年齡。"}, {"topic": "社交技巧訓練 SST", "ref": "第 37–39 張", "q": "治療師要教導「加入正在進行的對話」。下列安排最符合講義的 SST 五步驟循環？", "o": ["界定技能與成功標準、示範、角色扮演、具體回饋、跨情境泛化", "先反覆說明所有社交規則，等完全記住後才安排演練", "直接進入高難度真實情境，只在失敗後說明正確做法", "只練熟同一套台詞，並以背誦正確率作為最終成果"], "a": 0, "e": "SST 將技能拆成可教、可練與可回饋的行為。講義依序列出界定技能、示範、角色扮演、具體回饋及情境泛化，並提醒需記錄新情境中的實際表現。"}, {"topic": "社會故事", "ref": "第 40–41 張", "q": "治療師為即將參加社團的學生撰寫社會故事，下列設計何者最適當？", "o": ["強調「一定要立刻回答所有問題」，以建立服從規則", "以一份通用故事取代對個別情境的了解", "描述真實情境與他人可能觀點，提供可行選擇，並搭配理解確認及演練", "只記錄學生曾經做錯的行為，要求反覆閱讀避免再犯"], "a": 2, "e": "社會故事應個別化、簡短、正向，描述多於命令，包含情境線索、觀點與可行選擇。它是情境預告與理解工具，仍需配合環境調整及實際互動練習。"}, {"topic": "同儕媒介介入", "ref": "第 42–43 張", "q": "兩人合作規劃校園行程時，受訓同儕為了提高完成效率，直接替個案回答並決定所有地點。依講義，最適當的調整為何？", "o": ["讓同儕繼續代答，只要完成行程表即達成目標", "要求成人全程指揮，避免兩人意見不同", "只計算個案說話次數，不需考慮決定權", "讓雙方各持不同資訊，同儕邀請意見後等待，成人僅在必要時提示"], "a": 3, "e": "同儕媒介介入要讓雙方都有資訊與決定權。同儕需學習邀請、等待與回應，不代替個案回答；成果同時看共同決策、投入及參與品質，不能只看任務完成。"}, {"topic": "聯合注意力", "ref": "第 44–45 張", "q": "孩子看到有趣的玩具後，將玩具舉向成人並發出聲音分享，但沒有持續眼神接觸。依講義，最適當的判斷為何？", "o": ["只要沒有持續眼神接觸，就不能算任何共享注意表現", "展示與聲音可能是主動分享興趣的線索，應觀察是否與成人共享對該玩具的注意", "應先停止遊戲，直到孩子能長時間直視成人", "只有用完整句子描述玩具，才可以記錄為成功"], "a": 1, "e": "聯合注意力重點在共享對物件或事件的注意。眼神、手勢、展示、聲音、語言或 AAC 都可能提供成功線索，仍須觀察其共享功能，不能只以持續眼神接觸或完整口語為唯一標準。"}, {"topic": "介入泛化與成效判斷", "ref": "第 37–39、42–45 張", "q": "學生已能在治療室向固定治療師提出請求。若目標是提升日常校園參與，下一步最能確認介入成效的做法為何？", "o": ["更換人物與場所安排真實請求任務，記錄獨立表現、提示需求及互動品質", "增加同一治療師、同一台詞的背誦次數，作為唯一成效指標", "直接認定能力已能運用於所有校園情境，結束追蹤", "改以理論名詞測驗取代實際互動觀察"], "a": 0, "e": "講義強調跨人物、場所與難度的情境泛化，並兼顧提示程度與參與品質。治療室的熟悉任務表現進步，仍需透過新情境中的行為與參與紀錄確認能否運用。"}];const form=document.getElementById('quiz');const letters='ABCD';let answersVisible=false;let graded=false;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
questions.forEach((q,i)=>{const article=el('article');const fs=el('fieldset');const legend=el('legend');const h=el('h2');h.append(el('span','number',String(i+1).padStart(2,'0')),document.createTextNode(q.q));legend.append(h);fs.append(legend);const opts=el('div','options');q.o.forEach((opt,j)=>{const label=el('label','option');label.id=`q${i}o${j}`;const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;label.append(radio,el('span','',letters[j]+'. '+opt));opts.append(label)});fs.append(opts);article.append(fs,el('div','feedback'));const exp=el('div','explanation hidden');exp.append(el('strong','',`答案：${letters[q.a]}　｜　${q.topic}`),el('p','',q.e),el('p','source','講義依據：'+q.ref));article.append(exp);form.append(article)});
function showAnswers(show){answersVisible=show;document.querySelectorAll('.explanation').forEach(n=>n.classList.toggle('hidden',!show));document.getElementById('answers').textContent=show?'隱藏答案與解析':'顯示答案與解析';document.getElementById('answers').setAttribute('aria-pressed',String(show))}
function clearMarks(){document.querySelectorAll('.option').forEach(n=>n.classList.remove('correct','incorrect'));document.querySelectorAll('.feedback').forEach(n=>n.textContent='')}
document.getElementById('grade').onclick=()=>{clearMarks();let score=0,done=0;questions.forEach((q,i)=>{const selected=form.querySelector(`input[name="q${i}"]:checked`);const feedback=form.children[i].querySelector('.feedback');if(selected){done++;const v=Number(selected.value);if(v===q.a){score++;feedback.textContent='答對'}else{feedback.textContent=`答錯，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${v}`).classList.add('incorrect')}}else feedback.textContent=`未作答，正確答案為 ${letters[q.a]}`;document.getElementById(`q${i}o${q.a}`).classList.add('correct')});document.getElementById('result').textContent=`得分 ${score}／15 分（${Math.round(score/15*100)}%）・已答 ${done} 題・未答 ${15-done} 題。未答題以 0 分計。`;graded=true;showAnswers(true)};
document.getElementById('answers').onclick=()=>{showAnswers(!answersVisible);if(!answersVisible){clearMarks();document.getElementById('result').textContent='';graded=false}};
form.addEventListener('change',()=>{if(graded){clearMarks();document.getElementById('result').textContent='作答已變更，請重新提交計分。';graded=false}});
document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>{form.reset();clearMarks();showAnswers(false);graded=false;document.getElementById('result').textContent='已清除作答。'};
</script></body></html>
